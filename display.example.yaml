# Display platform config -- which app drives the screen, and shared resources.
# Copy this to display.yaml and edit for your host (display.yaml is gitignored
# so your site-specific endpoints/IPs stay local). If display.yaml is absent the
# app falls back to this example.
# Mode changes apply on service restart: sudo systemctl restart turing-display.service

mode: carousel        # standard | carousel | netmap

screen:
  orientation: landscape       # landscape | reverse_landscape
  brightness: 20
  # Night/away mode: dim or switch the panel off during time windows.
  # Windows are checked every loop tick; first match wins. Applied on restart.
  # schedule:
  #   - {from: "22:30", to: "06:30", brightness: 5}
  #   - {from: "01:00", to: "06:00", off: true}

# Named data sources. Apps reference these by name; `prom` is the default.
# Add more prometheus endpoints (or future source types) here.
sources:
  prom:
    type: prometheus
    url: http://localhost:9090/api/v1/query   # your Prometheus HTTP API

netmap:
  source: prom
  refresh: 30                  # seconds between full redraws
  center_label: LAN
  up_query: up{job=~".*node.*"}
  # Clients badge (footer center): "+N clients", amber NEW flag while a
  # first-seen MAC is younger than new_window hours. Read PASSIVELY from the
  # kernel neighbour table (`ip neigh`) -- sends zero packets, only reports
  # devices the host already learned from normal traffic (so the count is a
  # subset of the LAN, not a full scan). Monitored hosts are excluded by
  # resolving their prom instance names; list any that don't resolve here.
  # infra_ips: [10.0.0.30, 10.0.0.31]   # IPs of monitored hosts whose prom
  #                                       # instance name doesn't resolve via DNS
  # new_window: 24             # hours a newcomer MAC stays flagged NEW
  # state_file: ~/.local/state/turing-display/seen-macs.json
  # neigh_cmd: [ip, -4, neigh, show]   # override the neighbour-table command
